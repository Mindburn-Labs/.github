name: Docs Truth Public Reusable

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      changed_base:
        required: false
        type: string
    secrets:
      MINDBURN_ORG_READ_TOKEN:
        required: true

jobs:
  candidate-head-pending:
    name: docs-truth-candidate-head-pending
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish pending candidate-head status
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const pull = context.payload.pull_request;
            if (!pull || pull.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Candidate-head status requires a same-repository pull request.');
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: pull.head.sha,
              state: 'pending',
              context: 'Docs Truth / candidate-head',
              description: 'Trusted docs-truth recomputation is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  docs-truth:
    name: docs-truth
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      subject_repo: ${{ steps.subject.outputs.repo }}
    steps:
      - name: Validate trusted event and caller binding
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          case "$GITHUB_REPOSITORY" in
            Mindburn-Labs/*) ;;
            *)
              echo "::error::Docs Truth is restricted to Mindburn-Labs callers."
              exit 1
              ;;
          esac
          subject="${GITHUB_REPOSITORY#*/}"
          case "$EVENT_NAME" in
            pull_request_target)
              if [ "$EVENT_REF" != "refs/heads/main" ]; then
                echo "::error::pull_request_target must target refs/heads/main."
                exit 1
              fi
              if [ "$PR_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
                echo "::error::Secret-backed Docs Truth rejects fork pull requests."
                exit 1
              fi
              if [ "$subject" = "docs" ]; then
                echo "::error::docs pull requests require the unprivileged/broker lane; a candidate ledger cannot attest itself."
                exit 1
              fi
              ;;
            push)
              if [ "$EVENT_REF" != "refs/heads/main" ]; then
                echo "::error::Secret-backed Docs Truth push runs require refs/heads/main."
                exit 1
              fi
              ;;
            *)
              echo "::error::Secret-backed Docs Truth requires pull_request_target or push on refs/heads/main."
              exit 1
              ;;
          esac

      - name: Resolve subject repo
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ ! "$repo" =~ ^[A-Za-z0-9._-]+$ ]] || [ "$repo" = "." ] || [ "$repo" = ".." ]; then
            echo "::error::Invalid subject repository name"
            exit 1
          fi
          local_name="$repo"
          if [ "$repo" = ".github" ]; then
            local_name=".github-repo"
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "local_name=$local_name" >> "$GITHUB_OUTPUT"

      - name: Checkout subject repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          path: workspace/${{ steps.subject.outputs.local_name }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ github.token }}

      # Immutable review mirror, not a second runtime authority:
      # .github/scripts/docs-truth-org.rb is byte-identical to
      # Mindburn-Labs/dev-orchestration@3d8f07723dff90aaa83473a3e8134f6ae93d501b:
      # estate-control-plane/scripts/docs-truth-org.rb. Makefile pins the mirror
      # and the next step pins the executed upstream bytes to the same digest.
      - name: Checkout reviewed docs-truth runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Mindburn-Labs/dev-orchestration
          ref: 3d8f07723dff90aaa83473a3e8134f6ae93d501b
          path: .trusted/docs-truth-runner
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}

      - name: Verify reviewed runner bytes
        shell: bash
        run: |
          set -euo pipefail
          runner=".trusted/docs-truth-runner/estate-control-plane/scripts/docs-truth-org.rb"
          ruby -rdigest -e '
            expected = "d9b7ff6e01d5ca64d2b37fc9714528501a0bd97097fe07130cff5186340dfcd0"
            actual = Digest::SHA256.file(ARGV.fetch(0)).hexdigest
            abort "docs-truth runner digest mismatch: expected #{expected}, got #{actual}" unless actual == expected
          ' "$runner"
          ruby -c "$runner" >/dev/null

      - name: Checkout .github inventory
        if: steps.subject.outputs.repo != '.github'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Mindburn-Labs/.github
          path: workspace/.github-repo
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}

      - name: Checkout docs truth ledger
        if: steps.subject.outputs.repo != 'docs'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Mindburn-Labs/docs
          path: workspace/docs
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}

      - name: Assert candidate checkout is data-only
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          SUBJECT_REPO: ${{ steps.subject.outputs.repo }}
          SUBJECT_PATH: workspace/${{ steps.subject.outputs.local_name }}
        run: |
          set -euo pipefail
          if git -C "$SUBJECT_PATH" config --local --get-regexp '^(credential\.|http\..*\.extraheader)' >/dev/null; then
            echo "::error::Candidate checkout retained Git credentials"
            exit 1
          fi
          if git -C "$SUBJECT_PATH" ls-files -s -- '*.md' '*.mdx' | awk '$1 != "100644" && $1 != "100755" { found=1 } END { exit found ? 0 : 1 }'; then
            echo "::error::Candidate Markdown must be regular files"
            exit 1
          fi
          if git -C "$SUBJECT_PATH" ls-files -s -- repo-manifest.yaml docs-truth.yaml | awk '$1 != "100644" && $1 != "100755" { found=1 } END { exit found ? 0 : 1 }'; then
            echo "::error::Candidate docs-truth policy inputs must be regular files"
            exit 1
          fi
          ruby -rcsv -e '
            rows = CSV.read("workspace/docs/audit/markdown-estate-ledger.csv", headers: true)
            subject = ENV.fetch("SUBJECT_REPO")
            executable = rows.select do |row|
              next false unless row["repo"].to_s.strip == subject

              status = row["status"].to_s.strip.downcase
              truth_gate = row["truth_gate"].to_s.strip
              status == "generated" || !truth_gate.empty?
            end
            abort "candidate data-only review rejects generated or truth_gate rows: #{executable.map { |row| row["path"] }.join(", ")}" unless executable.empty?
          '

      - name: Run docs truth gate
        shell: bash
        env:
          INPUT_CHANGED_BASE: ${{ inputs.changed_base }}
          SUBJECT_REPO: ${{ steps.subject.outputs.repo }}
        run: |
          args=(
            --mode local
            --workspace-root "$GITHUB_WORKSPACE/workspace"
            --repo "$SUBJECT_REPO"
            --report "$RUNNER_TEMP/docs-truth-report.json"
          )
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            changed_base="${{ github.event.pull_request.base.sha }}"
          else
            changed_base="$INPUT_CHANGED_BASE"
          fi
          if [ -n "$changed_base" ]; then
            args+=(--changed-base "$changed_base")
          fi
          ruby "$GITHUB_WORKSPACE/.trusted/docs-truth-runner/estate-control-plane/scripts/docs-truth-org.rb" "${args[@]}"

      - name: Upload docs truth report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-truth-report
          path: ${{ runner.temp }}/docs-truth-report.json
          if-no-files-found: ignore

  comment:
    name: docs-truth-comment
    needs: docs-truth
    if: always() && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      # The caller must also grant pull-requests: write. This isolated job has
      # no candidate checkout and never references or exports the organization
      # read token.
      pull-requests: write
    steps:
      - name: Download docs truth report
        id: report
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-truth-report
          path: ${{ runner.temp }}

      # Post-hoc: on a pull_request run, if the report contains any
      # missing_ledger_row failures, upsert a PR comment that lists the offending
      # files and gives the reader a copy-paste-ready block of CSV rows to add
      # to Mindburn-Labs/docs/audit/markdown-estate-ledger.csv. The intent is to
      # remove the "recurring silent-orphan" pain-point where autonomous agents
      # add tracked markdown without opening the paired ledger PR (root cause of
      # multiple docs-truth stalls this week; see the fixes in Mindburn-Labs/docs
      # #27 and #28). If the report is clean, any prior orphan comment on this PR
      # is deleted so a re-opened PR doesn't carry stale advice.
      - name: Post orphan-ledger PR comment
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          REPORT_PATH: ${{ runner.temp }}/docs-truth-report.json
          SUBJECT_REPO: ${{ needs.docs-truth.outputs.subject_repo }}
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- docs-truth-orphan-comment -->';
            const path = process.env.REPORT_PATH;

            async function findExistingComment() {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  per_page: 100,
                }
              );
              return comments.find(
                (c) =>
                  c.user?.login === 'github-actions[bot]' &&
                  (c.body || '').startsWith(MARKER)
              );
            }

            async function deleteIfExists() {
              const existing = await findExistingComment();
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
                core.info(`Deleted stale orphan-ledger comment ${existing.id}`);
              }
            }

            if (!fs.existsSync(path)) {
              core.info('No docs-truth-report.json found — nothing to comment on.');
              await deleteIfExists();
              return;
            }

            let report;
            try {
              report = JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch (err) {
              core.warning(`Could not parse docs-truth-report.json: ${err.message}`);
              await deleteIfExists();
              return;
            }

            const orphans = (report.failures || []).filter(
              (f) => f.code === 'missing_ledger_row'
            );

            if (orphans.length === 0) {
              // Report is clean of orphan failures — remove any stale comment
              // from a previous run so the PR reads accurately.
              await deleteIfExists();
              return;
            }

            const subject = process.env.SUBJECT_REPO;
            const sourceRefs = [
              `${subject}:Makefile`,
              `${subject}:catalog-info.yaml`,
              `${subject}:agent.yaml`,
              `.github-repo:repo-manifest.yaml`,
            ].join(';');
            const notes =
              'initial docs-truth inventory row generated from tracked markdown; source_refs name owning repo evidence or gates';

            // A PR author can smuggle backticks or newlines through a
            // crafted markdown filename and inject arbitrary content into
            // this bot-authored comment. Escape every untrusted value
            // (report.failures[].path) before interpolating.
            //
            //   - Markdown display: use an HTML code element, escape HTML
            //     metacharacters, and visualize control/bidirectional marks.
            //     Backslash escapes do not protect backticks inside a Markdown
            //     code span, so untrusted paths must not delimit that span.
            //   - CSV escape: RFC 4180 — wrap every field in ", double any
            //     internal ", visualize CR/LF so the row stays single-line.
            //     Applied to every column (including the static ones) so the
            //     block round-trips cleanly if a reader pastes it into the
            //     ledger CSV. Ledger fields treat "" and unquoted "" as
            //     equivalent empty strings.
            const escapeHtmlCode = (value) =>
              String(value)
                .replace(/[\u0000-\u001f\u007f-\u009f\u202a-\u202e\u2066-\u2069]/gu, (char) =>
                  `\\u{${char.codePointAt(0).toString(16)}}`
                )
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            const escapeCsvField = (value) =>
              `"${String(value)
                .replace(/"/g, '""')
                .replace(/\r/g, '\\r')
                .replace(/\n/g, '\\n')}"`;

            const rows = orphans
              .map((f) =>
                [
                  subject,
                  f.path,
                  'active',
                  subject,
                  'repo_docs',
                  sourceRefs,
                  '',
                  'false',
                  '',
                  notes,
                ]
                  .map(escapeCsvField)
                  .join(',')
              )
              .join('\n');

            const fileList = orphans
              .map((f) => `- <code>${escapeHtmlCode(f.path)}</code>`)
              .join('\n');

            const body = [
              MARKER,
              `## Docs Truth: \`missing_ledger_row\` — ${orphans.length} file(s) need ledger rows`,
              '',
              `Tracked markdown in \`${subject}\` has no matching row in the org ledger`,
              `(\`Mindburn-Labs/docs/audit/markdown-estate-ledger.csv\`). This gate will stay`,
              `red on \`main\` after merge until the rows are added there.`,
              '',
              '<details><summary>Files that need ledger rows</summary>',
              '',
              fileList,
              '',
              '</details>',
              '',
              '### Fix — open a small PR against `Mindburn-Labs/docs`',
              '',
              `Append these rows to \`audit/markdown-estate-ledger.csv\` (schema: \`repo,path,status,owner,truth_kind,source_refs,truth_gate,public_surface,superseded_by,notes\`):`,
              '',
              '```csv',
              rows,
              '```',
              '',
              `Adjust \`source_refs\` if \`${subject}\` does not have all four of \`Makefile\`, \`catalog-info.yaml\`, \`agent.yaml\`, and the \`.github-repo:repo-manifest.yaml\` entry — grep neighboring \`${subject},\` rows in the CSV to see the canonical set for this repo. Keep the new rows alphabetically ordered inside the \`${subject},\` block.`,
              '',
              `Once the ledger PR merges, re-run this job (\`gh run rerun ${context.runId} --repo ${context.repo.owner}/${context.repo.repo} --failed\`) to turn this gate green.`,
              '',
              `<sub>Auto-generated by \`Mindburn-Labs/.github/.github/workflows/docs-truth-public.yml\`. Longer-term refactor of the two-repo ledger flow is tracked in [HELM-41](https://linear.app/mindburn/issue/HELM-41).</sub>`,
            ].join('\n');

            const existing = await findExistingComment();
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated orphan-ledger comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info(`Created orphan-ledger comment on PR #${context.issue.number}`);
            }

  candidate-head-status:
    name: docs-truth-candidate-head
    needs: [candidate-head-pending, docs-truth]
    if: always() && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish final candidate-head status
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          DOCS_TRUTH_RESULT: ${{ needs.docs-truth.result }}
        with:
          script: |
            const pull = context.payload.pull_request;
            if (!pull || pull.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Candidate-head status requires a same-repository pull request.');
              return;
            }
            const passed = process.env.DOCS_TRUTH_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: pull.head.sha,
              state: passed ? 'success' : 'failure',
              context: 'Docs Truth / candidate-head',
              description: passed
                ? 'Trusted docs-truth recomputation passed'
                : `Trusted docs-truth result: ${process.env.DOCS_TRUTH_RESULT}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (!passed) {
              core.setFailed(`Docs Truth did not pass: ${process.env.DOCS_TRUTH_RESULT}`);
            }
