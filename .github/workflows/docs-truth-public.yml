name: Docs Truth Trusted Worker

permissions:
  actions: read
  contents: read
  pull-requests: read

on:
  workflow_call:
    secrets:
      MINDBURN_ORG_READ_TOKEN:
        required: true

jobs:
  docs-truth-trusted:
    name: docs-truth-trusted
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Bind called workflow identity
        id: identity
        shell: bash
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          job = json.loads(os.environ["JOB_CONTEXT"])
          repository = job.get("workflow_repository")
          workflow_sha = job.get("workflow_sha")
          workflow_ref = job.get("workflow_ref")
          workflow_file_path = job.get("workflow_file_path")
          if repository != "Mindburn-Labs/.github":
              raise SystemExit("trusted worker repository mismatch")
          if not isinstance(workflow_sha, str) or re.fullmatch(r"[0-9a-f]{40}", workflow_sha) is None:
              raise SystemExit("trusted worker must be called by immutable commit SHA")
          expected_path = ".github/workflows/docs-truth-public.yml"
          expected_ref = f"{repository}/{expected_path}@{workflow_sha}"
          if workflow_file_path != expected_path or workflow_ref != expected_ref:
              raise SystemExit("trusted worker call must use the exact workflow path at its resolved SHA")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"workflow_repository={repository}\n")
              output.write(f"workflow_sha={workflow_sha}\n")
          PY

      - name: Derive exact pull request admission
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          ADMISSION_PATH: ${{ runner.temp }}/docs-truth-admission.json
          EXPECTED_REPOSITORY: Mindburn-Labs/app-helm-docs
          EXPECTED_WORKFLOW_ID: "305654002"
          EXPECTED_WORKFLOW_NAME: Docs Truth
          EXPECTED_WORKFLOW_PATH: .github/workflows/docs-truth.yml
        with:
          github-token: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}
          script: |
            const fs = require('fs');
            const expectedRepository = process.env.EXPECTED_REPOSITORY;
            const [owner, repo] = expectedRepository.split('/');
            const expectedWorkflowId = Number(process.env.EXPECTED_WORKFLOW_ID);
            const expectedWorkflowName = process.env.EXPECTED_WORKFLOW_NAME;
            const expectedWorkflowPath = process.env.EXPECTED_WORKFLOW_PATH;
            const eventRun = context.payload.workflow_run;
            const shaPattern = /^[0-9a-f]{40}$/;

            function fail(message) {
              throw new Error(`docs-truth admission rejected: ${message}`);
            }
            function requirePositiveInteger(value, label) {
              if (!Number.isSafeInteger(value) || value <= 0) fail(`${label} must be a positive integer`);
              return value;
            }
            function requireSha(value, label) {
              if (typeof value !== 'string' || !shaPattern.test(value)) fail(`${label} must be a lowercase SHA`);
              return value;
            }
            function requireRun(run, label) {
              if (!run || typeof run !== 'object') fail(`${label} is missing`);
              if (run.repository?.full_name !== expectedRepository) fail(`${label}.repository mismatch`);
              if (run.head_repository?.full_name !== expectedRepository) fail(`${label}.head_repository mismatch`);
              if (run.workflow_id !== expectedWorkflowId) fail(`${label}.workflow_id mismatch`);
              if (run.name !== expectedWorkflowName) fail(`${label}.name mismatch`);
              if (run.path !== expectedWorkflowPath) fail(`${label}.path mismatch`);
              if (run.event !== 'pull_request') fail(`${label}.event must be pull_request`);
              if (run.status !== 'completed' || run.conclusion !== 'success') fail(`${label} must be a successful completed run`);
              requirePositiveInteger(run.id, `${label}.id`);
              requirePositiveInteger(run.run_attempt, `${label}.run_attempt`);
              requireSha(run.head_sha, `${label}.head_sha`);
            }

            if (context.eventName !== 'workflow_run') fail('caller event must be workflow_run');
            requireRun(eventRun, 'event.workflow_run');

            const response = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: eventRun.id,
              exclude_pull_requests: false,
            });
            const run = response.data;
            requireRun(run, 'api.workflow_run');
            if (run.id !== eventRun.id) fail('workflow run id changed across snapshots');
            if (run.run_attempt !== eventRun.run_attempt) fail('workflow run attempt changed across snapshots');
            if (run.head_sha !== eventRun.head_sha) fail('workflow run head changed across snapshots');

            const associated = await github.paginate(
              'GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls',
              { owner, repo, commit_sha: run.head_sha, per_page: 100 },
            );
            const candidates = associated.filter(
              (pull) =>
                pull.state === 'open' &&
                pull.base?.ref === 'main' &&
                pull.base?.repo?.full_name === expectedRepository &&
                pull.head?.repo?.full_name === expectedRepository &&
                pull.head?.sha === run.head_sha,
            );
            if (candidates.length !== 1) fail('head SHA must identify exactly one open same-repository PR to main');

            const pullNumber = requirePositiveInteger(candidates[0].number, 'pull_request.number');
            const pullResponse = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
            const pull = pullResponse.data;
            if (pull.state !== 'open') fail('pull request must remain open');
            if (pull.base?.ref !== 'main' || pull.base?.repo?.full_name !== expectedRepository) fail('pull request base mismatch');
            if (pull.head?.repo?.full_name !== expectedRepository) fail('fork pull requests are not admitted');
            const baseSha = requireSha(pull.base?.sha, 'pull_request.base.sha');
            const headSha = requireSha(pull.head?.sha, 'pull_request.head.sha');
            const mergeSha = requireSha(pull.merge_commit_sha, 'pull_request.merge_commit_sha');
            if (headSha !== run.head_sha) fail('pull request head does not match workflow run head');

            const admission = {
              schema: 'mindburn.authority-pr-admission/v1',
              repository: expectedRepository,
              pr_number: pullNumber,
              base: { ref: 'main', sha: baseSha },
              head: { repository: expectedRepository, sha: headSha },
              merge_sha: mergeSha,
              workflow_run_head_sha: run.head_sha,
            };
            fs.writeFileSync(process.env.ADMISSION_PATH, `${JSON.stringify(admission)}\n`, {
              encoding: 'utf8',
              mode: 0o600,
              flag: 'wx',
            });

      - name: Load exact trusted worker source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Mindburn-Labs/.github
          ref: ${{ steps.identity.outputs.workflow_sha }}
          path: trusted-worker
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}

      - name: Verify trusted worker source
        shell: bash
        env:
          TRUSTED_WORKFLOW_SHA: ${{ steps.identity.outputs.workflow_sha }}
        run: |
          observed=$(git -C "$GITHUB_WORKSPACE/trusted-worker" rev-parse HEAD)
          if [ "$observed" != "$TRUSTED_WORKFLOW_SHA" ]; then
            echo "::error::Trusted worker checkout did not resolve to the called workflow SHA"
            exit 1
          fi

      - name: Load pinned Docs Truth ledger
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Mindburn-Labs/docs
          ref: 6f9b686a4db10fed2f968cf2474477051d43c0b0
          path: workspace/docs
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}

      - name: Load pinned Docs Truth runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Mindburn-Labs/dev-orchestration
          ref: 4338b9ae6b76284aeee7a4cfe9f8d6ef9f101156
          path: workspace/dev-orchestration
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}

      - name: Bind candidate Git objects without checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}
        run: |
          python3 "$GITHUB_WORKSPACE/trusted-worker/scripts/fetch_pull_request_git_objects.py" \
            --admission "$RUNNER_TEMP/docs-truth-admission.json" \
            --output "$RUNNER_TEMP/app-helm-docs.git" \
            --receipt "$RUNNER_TEMP/docs-truth-object-receipt.json"

      - name: Verify workflow tree and materialize inert data
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/trusted-worker/scripts/verify_workflow_tree.py" \
            --profile app-helm-docs \
            --parent-repository "$RUNNER_TEMP/app-helm-docs.git" \
            --candidate-repository "$RUNNER_TEMP/app-helm-docs.git" \
            --object-receipt "$RUNNER_TEMP/docs-truth-object-receipt.json" \
            --materialize-directory "$GITHUB_WORKSPACE/workspace/app-helm-docs" \
            --index-file "$RUNNER_TEMP/app-helm-docs.index" \
            --output "$RUNNER_TEMP/docs-truth-workflow-admission.json"

      - name: Stage trusted inventory and reject executable ledger rows
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/workspace/.github-repo"
          cp "$GITHUB_WORKSPACE/trusted-worker/repo-manifest.yaml" \
            "$GITHUB_WORKSPACE/workspace/.github-repo/repo-manifest.yaml"
          ruby -rcsv -e '
            ledger = CSV.read(ARGV.fetch(0), headers: true)
            rows = ledger.select { |row| row["repo"] == "app-helm-docs" }
            unsafe = rows.select do |row|
              row["status"] == "generated" || !row["truth_gate"].to_s.strip.empty?
            end
            abort "app-helm-docs ledger contains executable truth_gate semantics" unless unsafe.empty?
          ' "$GITHUB_WORKSPACE/workspace/docs/audit/markdown-estate-ledger.csv"

      - name: Verify trusted pre-merge contract implementation
        shell: bash
        run: |
          echo "e0d29e03c4c4ad8bc5f20955ce53c2d944f4af280b0e7442c61f9bd0b732ff9d  trusted-worker/scripts/stage-docs-truth-premerge-contracts.rb" | sha256sum --check

      - name: Stage verified pre-merge ledger contracts
        shell: bash
        env:
          GITHUB_REPOSITORY: Mindburn-Labs/app-helm-docs
          GITHUB_TOKEN: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}
        run: |
          ruby "$GITHUB_WORKSPACE/trusted-worker/scripts/stage-docs-truth-premerge-contracts.rb" \
            --ledger "$GITHUB_WORKSPACE/workspace/docs/audit/markdown-estate-ledger.csv" \
            --root "$GITHUB_WORKSPACE/workspace/app-helm-docs" \
            --repo app-helm-docs

      - name: Resolve immutable Git bindings
        id: binding
        shell: bash
        run: |
          ruby -rjson -e '
            admission = JSON.parse(File.read(ARGV.fetch(0)))
            puts "base_sha=#{admission.fetch("base").fetch("sha")}"
          ' "$RUNNER_TEMP/docs-truth-admission.json" >> "$GITHUB_OUTPUT"

      - name: Recompute Docs Truth from inert merge data
        shell: bash
        env:
          GIT_DIR: ${{ runner.temp }}/app-helm-docs.git
          GIT_INDEX_FILE: ${{ runner.temp }}/app-helm-docs.index
          GIT_WORK_TREE: ${{ github.workspace }}/workspace/app-helm-docs
          CHANGED_BASE_SHA: ${{ steps.binding.outputs.base_sha }}
        run: |
          ruby "$GITHUB_WORKSPACE/workspace/dev-orchestration/estate-control-plane/scripts/docs-truth-org.rb" \
            --mode local \
            --workspace-root "$GITHUB_WORKSPACE/workspace" \
            --repo app-helm-docs \
            --changed-base "$CHANGED_BASE_SHA" \
            --report "$RUNNER_TEMP/docs-truth-report.json"
