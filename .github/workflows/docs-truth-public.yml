name: Docs Truth Public Reusable

permissions:
  contents: read
  # Needed by the "Post orphan-ledger PR comment" step to upsert a comment on
  # PRs when the report contains missing_ledger_row failures. Caller workflows
  # must also declare pull-requests: write for the token to actually carry
  # that permission — a reusable declaration alone is not enough.
  pull-requests: write

on:
  workflow_call:
    inputs:
      repo:
        required: false
        type: string
      changed_base:
        required: false
        type: string
    secrets:
      MINDBURN_ORG_READ_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      repo:
        description: Repository name to check. Defaults to the current repo.
        required: false
        type: string
      changed_base:
        description: Optional base ref for source/doc drift checks.
        required: false
        type: string

jobs:
  docs-truth:
    timeout-minutes: 20
    name: docs-truth
    runs-on: ubuntu-latest
    steps:
      - name: Resolve subject repo
        id: subject
        shell: bash
        env:
          INPUT_REPO: ${{ inputs.repo }}
        run: |
          repo="$INPUT_REPO"
          if [ -z "$repo" ]; then
            repo="${GITHUB_REPOSITORY#*/}"
          fi
          if [ "$repo" != ".github" ] && { [[ ! "$repo" =~ ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$ ]] || [[ "$repo" == *".."* ]]; }; then
            echo "::error::Invalid subject repository name"
            exit 1
          fi
          local_name="$repo"
          if [ "$repo" = ".github" ]; then
            local_name=".github-repo"
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "local_name=$local_name" >> "$GITHUB_OUTPUT"

      # A reusable workflow's `secrets: required: true` only checks that the
      # caller declared the key, not that the value is non-empty or usable. So
      # a deleted secret surfaces as actions/checkout's "Input required and not
      # supplied: token", and an under-scoped one as a bare 403 — both read as
      # checkout bugs. The 2026-07-16 sweep cost days to that ambiguity
      # (HELM-311). Fail here instead, naming the actual cause. Probe the entire
      # private read-set: a public subject can be readable while the private
      # ledger or runner checkout still fails.
      - name: Verify org read token
        shell: bash
        env:
          TOKEN: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}
          SUBJECT_REPO: ${{ steps.subject.outputs.repo }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::MINDBURN_ORG_READ_TOKEN resolved empty. The caller declared the secret but no value reached this run — it was deleted, or an org secret's visibility does not cover this repo."
            exit 1
          fi
          for repo in "$SUBJECT_REPO" .github docs dev-orchestration; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Mindburn-Labs/$repo")
            if [ "$code" != "200" ]; then
              echo "::error::MINDBURN_ORG_READ_TOKEN cannot read Mindburn-Labs/$repo (HTTP $code). 401=invalid or expired; 403=valid but insufficient scope; 404=token has no access to this repo. Checkout would fail next with a misleading git error."
              exit 1
            fi
          done

      - name: Checkout subject repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Mindburn-Labs/${{ steps.subject.outputs.repo }}
          path: workspace/${{ steps.subject.outputs.local_name }}
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.repo != '' && 'main' || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}

      - name: Checkout .github inventory
        if: steps.subject.outputs.repo != '.github'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Mindburn-Labs/.github
          path: workspace/.github-repo
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}

      - name: Checkout docs truth ledger
        if: steps.subject.outputs.repo != 'docs'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Mindburn-Labs/docs
          path: workspace/docs
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}

      - name: Checkout docs-truth runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Mindburn-Labs/dev-orchestration
          ref: 4338b9ae6b76284aeee7a4cfe9f8d6ef9f101156
          path: workspace/dev-orchestration
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}

      - name: Verify pre-merge contract implementation
        if: steps.subject.outputs.repo != '.github' && steps.subject.outputs.repo != 'docs' && github.repository == format('Mindburn-Labs/{0}', steps.subject.outputs.repo)
        shell: bash
        run: |
          echo "e0d29e03c4c4ad8bc5f20955ce53c2d944f4af280b0e7442c61f9bd0b732ff9d  workspace/.github-repo/scripts/stage-docs-truth-premerge-contracts.rb" | sha256sum --check

      - name: Stage verified pre-merge ledger contracts
        if: steps.subject.outputs.repo != '.github' && steps.subject.outputs.repo != 'docs' && github.repository == format('Mindburn-Labs/{0}', steps.subject.outputs.repo)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ruby "$GITHUB_WORKSPACE/workspace/.github-repo/scripts/stage-docs-truth-premerge-contracts.rb" \
            --ledger "$GITHUB_WORKSPACE/workspace/docs/audit/markdown-estate-ledger.csv" \
            --root "$GITHUB_WORKSPACE/workspace/${{ steps.subject.outputs.local_name }}" \
            --repo "${{ steps.subject.outputs.repo }}"

      - name: Run docs truth gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANGED_BASE: ${{ inputs.changed_base }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=(
            --mode local
            --workspace-root "$GITHUB_WORKSPACE/workspace"
            --repo "${{ steps.subject.outputs.repo }}"
            --report "$RUNNER_TEMP/docs-truth-report.json"
          )
          changed_base="$INPUT_CHANGED_BASE"
          if [ -z "$changed_base" ] && [ "$EVENT_NAME" = "pull_request" ]; then
            changed_base="$PR_BASE_SHA"
          fi
          if [ -n "$changed_base" ]; then
            if [[ ! "$changed_base" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || \
              { [[ ! "$changed_base" =~ ^[0-9a-fA-F]{40}$ ]] && ! git check-ref-format --allow-onelevel "$changed_base" >/dev/null 2>&1; }; then
              echo "::error::Invalid changed-base ref"
              exit 1
            fi
            args+=(--changed-base "$changed_base")
          fi
          ruby "$GITHUB_WORKSPACE/workspace/dev-orchestration/estate-control-plane/scripts/docs-truth-org.rb" "${args[@]}"

      - name: Upload docs truth report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-truth-report
          path: ${{ runner.temp }}/docs-truth-report.json
          if-no-files-found: ignore

      # Post-hoc: on a pull_request run, if the report contains any
      # missing_ledger_row failures, upsert a PR comment that lists the offending
      # files and gives the reader a copy-paste-ready block of CSV rows to add
      # to Mindburn-Labs/docs/audit/markdown-estate-ledger.csv. The intent is to
      # remove the "recurring silent-orphan" pain-point where autonomous agents
      # add tracked markdown without opening the paired ledger PR (root cause of
      # multiple docs-truth stalls this week; see the fixes in Mindburn-Labs/docs
      # #27 and #28). If the report is clean, any prior orphan comment on this PR
      # is deleted so a re-opened PR doesn't carry stale advice.
      - name: Post orphan-ledger PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          REPORT_PATH: ${{ runner.temp }}/docs-truth-report.json
          SUBJECT_REPO: ${{ steps.subject.outputs.repo }}
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- docs-truth-orphan-comment -->';
            const path = process.env.REPORT_PATH;

            async function findExistingComment() {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  per_page: 100,
                }
              );
              return comments.find(
                (c) =>
                  c.user?.login === 'github-actions[bot]' &&
                  (c.body || '').startsWith(MARKER)
              );
            }

            async function deleteIfExists() {
              const existing = await findExistingComment();
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
                core.info(`Deleted stale orphan-ledger comment ${existing.id}`);
              }
            }

            if (!fs.existsSync(path)) {
              core.info('No docs-truth-report.json found — nothing to comment on.');
              await deleteIfExists();
              return;
            }

            let report;
            try {
              report = JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch (err) {
              core.warning(`Could not parse docs-truth-report.json: ${err.message}`);
              await deleteIfExists();
              return;
            }

            const orphans = (report.failures || []).filter(
              (f) => f.code === 'missing_ledger_row'
            );

            if (orphans.length === 0) {
              // Report is clean of orphan failures — remove any stale comment
              // from a previous run so the PR reads accurately.
              await deleteIfExists();
              return;
            }

            const subject = process.env.SUBJECT_REPO;
            const sourceRefs = [
              `${subject}:Makefile`,
              `${subject}:catalog-info.yaml`,
              `${subject}:agent.yaml`,
              `.github-repo:repo-manifest.yaml`,
            ].join(';');
            const notes =
              'initial docs-truth inventory row generated from tracked markdown; source_refs name owning repo evidence or gates';

            // A PR author can smuggle backticks or newlines through a
            // crafted markdown filename and inject arbitrary content into
            // this bot-authored comment. Escape every untrusted value
            // (report.failures[].path) before interpolating.
            //
            //   - Markdown escape: backslash-escape backticks and backslashes
            //     inside the inline-code span; CR/LF replaced with visible
            //     literals so a single log-line stays on one line.
            //   - CSV escape: RFC 4180 — wrap every field in ", double any
            //     internal ", visualize CR/LF so the row stays single-line.
            //     Applied to every column (including the static ones) so the
            //     block round-trips cleanly if a reader pastes it into the
            //     ledger CSV. Ledger fields treat "" and unquoted "" as
            //     equivalent empty strings.
            const escapeMarkdownInline = (value) =>
              String(value)
                .replace(/\\/g, '\\\\')
                .replace(/`/g, '\\`')
                .replace(/\r/g, '\\r')
                .replace(/\n/g, '\\n');

            const escapeCsvField = (value) =>
              `"${String(value)
                .replace(/"/g, '""')
                .replace(/\r/g, '\\r')
                .replace(/\n/g, '\\n')}"`;

            const rows = orphans
              .map((f) =>
                [
                  subject,
                  f.path,
                  'active',
                  subject,
                  'repo_docs',
                  sourceRefs,
                  '',
                  'false',
                  '',
                  notes,
                ]
                  .map(escapeCsvField)
                  .join(',')
              )
              .join('\n');

            const fileList = orphans
              .map((f) => `- \`${escapeMarkdownInline(f.path)}\``)
              .join('\n');

            const body = [
              MARKER,
              `## Docs Truth: \`missing_ledger_row\` — ${orphans.length} file(s) need ledger rows`,
              '',
              `Tracked markdown in \`${subject}\` has no matching row in the org ledger`,
              `(\`Mindburn-Labs/docs/audit/markdown-estate-ledger.csv\`). This gate will stay`,
              `red on \`main\` after merge until the rows are added there.`,
              '',
              '<details><summary>Files that need ledger rows</summary>',
              '',
              fileList,
              '',
              '</details>',
              '',
              '### Fix — open a small PR against `Mindburn-Labs/docs`',
              '',
              `Append these rows to \`audit/markdown-estate-ledger.csv\` (schema: \`repo,path,status,owner,truth_kind,source_refs,truth_gate,public_surface,superseded_by,notes\`):`,
              '',
              '```csv',
              rows,
              '```',
              '',
              `Adjust \`source_refs\` if \`${subject}\` does not have all four of \`Makefile\`, \`catalog-info.yaml\`, \`agent.yaml\`, and the \`.github-repo:repo-manifest.yaml\` entry — grep neighboring \`${subject},\` rows in the CSV to see the canonical set for this repo. Keep the new rows alphabetically ordered inside the \`${subject},\` block.`,
              '',
              `Once the ledger PR merges, re-run this job (\`gh run rerun ${context.runId} --repo ${context.repo.owner}/${context.repo.repo} --failed\`) to turn this gate green.`,
              '',
              `<sub>Auto-generated by \`Mindburn-Labs/.github/.github/workflows/docs-truth-public.yml\`. Longer-term refactor of the two-repo ledger flow is tracked in [HELM-41](https://linear.app/mindburn/issue/HELM-41).</sub>`,
            ].join('\n');

            const existing = await findExistingComment();
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated orphan-ledger comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info(`Created orphan-ledger comment on PR #${context.issue.number}`);
            }
