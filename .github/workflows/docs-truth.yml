name: Docs Truth

permissions:
  contents: read
  pull-requests: write
  # The trusted target workflow publishes an explicit status on the candidate
  # SHA because pull_request_target's normal check is attached to the base SHA.
  statuses: write

on:
  # Keep the secret-bearing workflow definition on the trusted base branch.
  # The reusable workflow checks out the exact candidate commit as data only.
  pull_request_target:
    branches: [main]
  push:
    branches: [main]

jobs:
  docs-truth:
    name: docs-truth
    uses: ./.github/workflows/docs-truth-public.yml
    secrets:
      MINDBURN_ORG_READ_TOKEN: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}
