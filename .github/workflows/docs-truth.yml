name: Docs Truth

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  docs-truth:
    name: docs-truth
    # P0 containment: no candidate-controlled PR run may receive the
    # organization read token. This caller stays manual-only until HELM-198
    # supplies an immutable trusted broker that fetches candidate Git objects
    # as data without executing candidate code.
    uses: Mindburn-Labs/.github/.github/workflows/docs-truth-public.yml@b9040b9d9585bf035dd5178d7a4dcadbe9e2666e
    secrets:
      MINDBURN_ORG_READ_TOKEN: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}
