name: HELM Autonomous Release Permit

on:
  # P0 containment: candidate PRs must not receive model-review, OIDC, or
  # attestation authority. HELM-198 must replace this with an unprivileged
  # static PR lane plus an immutable trusted broker before it is restored.
  push:
    branches:
      - main

permissions: {}

jobs:
  local-validation:
    name: local-validation
    if: ${{ github.repository == 'Mindburn-Labs/.github' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate repository contract and workspace truth
        run: REQUIRE_WORKSPACE_CONTEXT=0 make lint test

  repository-gates:
    name: Deterministic repository gates
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact GitHub merge commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: target

      - name: Checkout immutable organization gate profiles
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Mindburn-Labs/.github
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: policy

      - name: Set up pinned Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Verify exact merge-parent binding
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$MERGE_SHA"
          read -r first_parent second_parent extra_parent < <(git -C target show -s --format='%P' "$MERGE_SHA")
          test -z "${extra_parent:-}"
          test "$first_parent" = "$BASE_SHA"
          test "$second_parent" = "$HEAD_SHA"

      - name: Run required repository gates
        env:
          CI: "true"
        run: |
          set -euo pipefail
          python3 policy/scripts/run_autonomous_release_gates.py \
            --repository "$GITHUB_REPOSITORY" \
            --target target \
            --profiles policy/config/autonomous-release-gates.json

  prepare:
    name: Bind immutable review input
    needs: repository-gates
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact GitHub merge commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: target

      - name: Checkout pinned policy helpers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Mindburn-Labs/.github
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: policy

      - name: Prepare commit-bound review bundle
        env:
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BASE_REF: refs/heads/${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_REPOSITORY: Mindburn-Labs/.github
          WORKFLOW_PATH: .github/workflows/ci.yml
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          ANTHROPIC_MODEL: claude-fable-5
          OPENAI_MODEL: gpt-5.6-sol
          KERNEL_SHA: daa1316e09d88b136258fbc14d1b276af7f6324a
          MAX_PATCH_BYTES: "524288"
          MAX_CHANGED_BLOB_BYTES: "8388608"
          # --elide-derived below withholds the BODY of generated artifacts from
          # the review patch while declaring each one, with its post-image
          # SHA256, to the reviewer. It lives here, in the SHA-pinned workflow
          # repository, and deliberately not in a file the pull request can edit:
          # a list the PR controls would let a change add its own path and hide
          # itself. Paths absent from a given repository are ignored.
          #
          # tools/boundary/protected.manifest is a sorted SHA256 index of the
          # kernel's protected surface, regenerated and byte-compared by
          # `make verify-boundary` in the same run. It was 78KB of the 106KB in
          # one pull request and carries nothing a reviewer can act on: its
          # content is a function of the other files in the same patch.
        run: |
          set -euo pipefail
          python3 policy/scripts/autonomous_release_permit.py prepare \
            --repository "$REPOSITORY" \
            --pull-request "$PULL_REQUEST" \
            --base-ref "$BASE_REF" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --merge-sha "$MERGE_SHA" \
            --workflow-repository "$WORKFLOW_REPOSITORY" \
            --workflow-path "$WORKFLOW_PATH" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --issued-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --anthropic-model "$ANTHROPIC_MODEL" \
            --openai-model "$OPENAI_MODEL" \
            --authority-manifest policy/config/autonomous-release-authority.json \
            --kernel-sha "$KERNEL_SHA" \
            --gate-profiles policy/config/autonomous-release-gates.json \
            --adversarial-corpus policy/tests/fixtures/autonomous-release-adversarial.json \
            --target-dir target \
            --output-dir permit-input \
            --max-patch-bytes "$MAX_PATCH_BYTES" \
            --max-changed-blob-bytes "$MAX_CHANGED_BLOB_BYTES" \
            --elide-derived tools/boundary/protected.manifest

      - name: Upload immutable review input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-permit-input
          path: permit-input
          if-no-files-found: error
          retention-days: 1

  model-review:
    name: ${{ matrix.provider }} / ${{ matrix.model }}
    needs: prepare
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: anthropic
            model: claude-fable-5
          - provider: openai
            model: gpt-5.6-sol
    steps:
      - name: Checkout pinned policy helpers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Mindburn-Labs/.github
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: policy

      - name: Checkout pinned Kernel verifier for read-only review
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Mindburn-Labs/helm-ai-kernel
          ref: daa1316e09d88b136258fbc14d1b276af7f6324a
          persist-credentials: false
          path: verifier-source
          sparse-checkout: |
            core/pkg/releasepermit
            core/cmd/release-permit-verify

      - name: Download immutable review input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-permit-input
          path: permit-input

      - name: Verify current authority generation
        env:
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(jq -r '.workflow_sha' permit-input/context.json)" = "$EXPECTED_WORKFLOW_SHA"
          test "$(jq -r '.run_id | tostring' permit-input/context.json)" = "$GITHUB_RUN_ID"
          test "$(jq -r '.run_attempt | tostring' permit-input/context.json)" = "$GITHUB_RUN_ATTEMPT"

      - name: Set up pinned Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Require provider authentication context
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "${GITHUB_TOKEN:-}" ]]; then
            echo "::error::missing provider secrets in this run context"
            exit 1
          fi

      - name: Install dependency-closed integrity-checked Copilot CLI
        env:
          EXPECTED_INTEGRITY: sha512-4pyNKunm7GEzQZ+09Dwr4BwixJVNcQGBeqiZPKWBGxcSipwj90t8tidLYdNjgmXJoLerANhXZcY52wJW/HubEA==
        run: |
          set -euo pipefail
          npm pack @github/copilot-linux-x64@1.0.70 --json > copilot-pack.json
          package_file="$(jq -r '.[0].filename' copilot-pack.json)"
          actual_integrity="sha512-$(openssl dgst -sha512 -binary "$package_file" | openssl base64 -A)"
          if [[ "$actual_integrity" != "$EXPECTED_INTEGRITY" ]]; then
            echo "::error::Copilot CLI package integrity mismatch"
            exit 1
          fi
          tar -xzf "$package_file" package/copilot
          install -m 0755 package/copilot "$RUNNER_TEMP/copilot"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run isolated read-only model review
        env:
          COPILOT_HOME: ${{ runner.temp }}/copilot-${{ matrix.provider }}
          COPILOT_CACHE_HOME: ${{ runner.temp }}/copilot-cache-${{ matrix.provider }}
          GITHUB_TOKEN: ${{ github.token }}
          PROVIDER: ${{ matrix.provider }}
          MODEL: ${{ matrix.model }}
          MODEL_REVIEW_ATTEMPT_TIMEOUT_SECONDS: "420"
        run: |
          set -euo pipefail
          bash policy/scripts/run_copilot_model_review.sh

      - name: Upload commit-bound review envelope
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-review-${{ matrix.provider }}
          path: review-${{ matrix.provider }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload non-authoritative provider diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-diagnostic-${{ matrix.provider }}
          path: |
            raw-${{ matrix.provider }}.txt
            stderr-${{ matrix.provider }}.txt
            normalized-${{ matrix.provider }}.json
            raw-${{ matrix.provider }}-attempt-*.txt
            stderr-${{ matrix.provider }}-attempt-*.txt
          if-no-files-found: ignore
          retention-days: 1

  permit:
    name: HELM Autonomous Release Permit
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    needs:
      - repository-gates
      - prepare
      - model-review
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download permit context
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-permit-input
          path: permit-input

      - name: Verify current authority generation
        env:
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(jq -r '.workflow_sha' permit-input/context.json)" = "$EXPECTED_WORKFLOW_SHA"
          test "$(jq -r '.run_id | tostring' permit-input/context.json)" = "$GITHUB_RUN_ID"
          test "$(jq -r '.run_attempt | tostring' permit-input/context.json)" = "$GITHUB_RUN_ATTEMPT"

      - name: Download available distinct-provider reviews
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-review-*
          path: reviews
          merge-multiple: true

      - name: Checkout pinned Kernel verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Mindburn-Labs/helm-ai-kernel
          ref: daa1316e09d88b136258fbc14d1b276af7f6324a
          persist-credentials: false
          path: kernel

      - name: Set up pinned Kernel toolchain
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: kernel/core/go.mod

      - name: Build source-owned permit verifier
        working-directory: kernel/core
        run: go build -trimpath -o "$GITHUB_WORKSPACE/release-permit-verify" ./cmd/release-permit-verify

      - name: Reduce distinct-provider reviews
        run: |
          set -euo pipefail
          mapfile -t review_paths < <(find reviews -type f -name 'review-*.json' -print | sort)
          if [[ "${#review_paths[@]}" -ne 2 ]]; then
            echo "::error::Exactly two review envelopes are required; found ${#review_paths[@]}"
            exit 1
          fi

          reviewer_identities=()
          review_args=()
          for path in "${review_paths[@]}"; do
            reviewer_identities+=("$(jq -er '[.reviewer.provider, .reviewer.model] | join("/")' "$path")")
            review_args+=(--review "$path")
          done
          reviewer_set="$(printf '%s\n' "${reviewer_identities[@]}" | sort -u)"
          expected_reviewer_set=$'anthropic/claude-fable-5\nopenai/gpt-5.6-sol'
          if [[ "$reviewer_set" != "$expected_reviewer_set" ]]; then
            echo "::error::Review envelopes do not contain the exact distinct-provider quorum"
            exit 1
          fi

          set +e
          ./release-permit-verify \
            --context permit-input/context.json \
            "${review_args[@]}" \
            --output release-permit.json \
            > permit-output.json
          verifier_status=$?
          set -e

          if [[ -f release-permit.json ]]; then
            {
              jq -r '"Decision: **" + .decision + "**  \nPermit: `" + .permit_id + "`  \nMerge tree: `" + .merge_tree_sha + "`"' release-permit.json
              echo
              echo "Reason codes:"
              jq -r '.reasons[]? | "- " + .code + " [" + (.reviewer // "quorum") + "]"' release-permit.json
            } >> "$GITHUB_STEP_SUMMARY"

            # Also emit the verdict into the job log. The step summary and the
            # uploaded artifact are the only places this used to appear, so a
            # denial read as the single line "denied or could not be verified"
            # and the reason codes could be recovered only by downloading the
            # artifact zip. This gate blocks merges; its reason must be legible
            # where people look first.
            # .detail carries reviewer-model prose. Collapse newlines so one
            # reason is one line, and refuse to let any of it begin a line with
            # "::" — Actions parses those as workflow commands, so unfiltered
            # model output would be an injection sink into this run.
            echo "::group::HELM autonomous release permit"
            {
              jq -r '"decision: " + .decision, "permit_id: " + .permit_id' release-permit.json
              jq -r '.reviews[]? | "reviewer " + .reviewer.provider + "/" + .reviewer.model
                     + ": " + .verdict
                     + " (blocking=" + (.blocking_findings|tostring)
                     + " advisory=" + (.advisory_findings|tostring) + ")"' release-permit.json
              jq -r '.reasons[]? | "reason: " + .code + " [" + (.reviewer // "quorum") + "]"
                     + (if .detail then " - " + (.detail | gsub("[\\r\\n\\t]+"; " ")) else "" end)' release-permit.json
            } | sed 's/^/  /'
            echo "::endgroup::"
          fi
          if [[ "$verifier_status" -ne 0 ]]; then
            echo "::error::HELM autonomous release permit denied or could not be verified"
            exit 1
          fi

      - name: Checkout pinned offline attestation signer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Mindburn-Labs/.github
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: policy

      - name: Set up pinned attestation runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: policy/tools/offline-attest/package-lock.json

      - name: Install integrity-locked offline attestation signer
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix policy/tools/offline-attest

      - name: Sign verified permit without platform persistence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node policy/tools/offline-attest/attest.mjs \
            release-permit.json \
            release-permit.attestation.json

      - name: Upload verified permit
        if: ${{ always() && hashFiles('release-permit.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: helm-autonomous-release-permit
          path: |
            release-permit.json
            release-permit.attestation.json
          if-no-files-found: error
          retention-days: 30
