# CI v2 caller. The required status check is `ci / gate`, so keep the job id `ci`.
# Public repositories cannot call workflows in the internal platform-actions
# repository, so this one calls the public copy next to it (see ci-v2.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/ci-v2.yml
